<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
      <td align="center" style="padding: 40px 16px;">
        <table role="presentation" width="100%" style="max-width: 520px;" cellspacing="0" cellpadding="0" border="0">
          <tr>
            <td style="background-color: #ffffff; border-radius: 8px; padding: 40px 36px;">

              <p style="margin: 0 0 16px 0; font-size: 16px; color: #222222;">
                Hi {{ username }} &#128075;,
              </p>

              <p style="margin: 0 0 28px 0; font-size: 16px; color: #222222;">
                To reset your password, please click on the link below:
              </p>

              <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td>
                    <a href="{{ password_reset_url }}" style="display: inline-block; padding: 12px 24px; background-color: #a8e6c0; color: #222222; font-size: 15px; font-weight: 500; text-decoration: none; border-radius: 6px;">
                      Reset Password
                    </a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
